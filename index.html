<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周树人作品全集 - 经典文学阅读馆</title>
    <link rel="stylesheet" href="css/style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1805477885216561"
         crossorigin="anonymous"></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <h1>周树人作品</h1>
                <p class="subtitle">横眉冷对千夫指，俯首甘为孺子牛 · 鲁迅作品精选与扩充</p>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索篇名、集名、人物或关键词...">
            </div>
        </div>
    </header>

    <main class="container main-content">
        <section class="intro-banner">
            <h2>馆藏作品</h2>
            <p>持续收录周树人（鲁迅）先生小说、散文、散文诗及杂文等作品，每页固定展示 9 部，支持分类筛选、搜索、翻页、夜间模式及字号调节。</p>
            <div class="category-bar" id="categoryBar">
                <button class="cat-btn active" data-cat="全部">全部</button>
                <button class="cat-btn" data-cat="小说">小说</button>
                <button class="cat-btn" data-cat="散文">散文</button>
                <button class="cat-btn" data-cat="散文诗">散文诗</button>
                <button class="cat-btn" data-cat="杂文">杂文</button>
            </div>
        </section>

        <!-- 广告位 -->
        <section class="ad-banner" style="width: 100%; min-height: 90px; margin: 16px 0;">
            <!-- 周树人的小说 -->
            <ins class="adsbygoogle"
                 style="display:block; width:100%;"
                 data-ad-client="ca-pub-1805477885216561"
                 data-ad-slot="8683621327"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </section>

        <section class="novel-grid" id="novelList">
            <!-- 作品列表将由 JS 动态渲染 -->
        </section>

        <nav class="pagination" id="pagination" aria-label="作品分页">
            <!-- 分页按钮将由 JS 动态渲染 -->
        </nav>
    </main>

    <!-- 阅读器模态框 -->
    <div class="reader-modal" id="readerModal" aria-hidden="true">
        <div class="reader-toolbar">
            <div class="toolbar-left">
                <button id="closeReaderBtn" class="btn-tool">← 返回目录</button>
                <span id="readerTitle" class="reader-doc-title"></span>
            </div>
            <div class="toolbar-right">
                <button id="fontDecreaseBtn" class="btn-tool" title="减小字号">A-</button>
                <button id="fontIncreaseBtn" class="btn-tool" title="增大字号">A+</button>
                <button id="themeToggleBtn" class="btn-tool" title="切换护眼/夜间模式">🌙 夜间</button>
            </div>
        </div>
        <div class="reader-body" id="readerBody">
            <article class="article-container" id="articleContainer">
                <h1 id="articleHeading"></h1>
                <div class="article-meta" id="articleMeta"></div>
                <div class="article-content" id="articleContent"></div>
                <div class="article-nav">
                    <button id="prevChapterBtn" class="btn-nav">上一篇</button>
                    <button id="nextChapterBtn" class="btn-nav">下一篇</button>
                </div>
            </article>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>周树人作品 · 经典文学阅读馆</p>
        </div>
    </footer>

    <script src="js/novels.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
